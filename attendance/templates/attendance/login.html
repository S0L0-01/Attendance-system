{% extends 'attendance/base.html' %}

{% block title %}Sign In - Student Attendance Portal{% endblock %}

{% block content %}
<div class="row justify-content-center py-5">
    <div class="col-md-6 col-lg-5">
        <div class="card p-4 shadow-sm">
            <div class="text-center mb-4">
                <i class="fa-solid fa-circle-user fa-3x text-primary mb-2"></i>
                <h3 class="fw-bold">Welcome Back</h3>
                <p class="text-muted">Sign in to view your attendance</p>
            </div>
            <form method="POST">
                {% csrf_token %}
                <div class="mb-3">
                    <label class="form-label" for="id_username">Username</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="fa-solid fa-user"></i></span>
                        <input type="text" name="username" class="form-control" id="id_username" required autofocus placeholder="Enter your username">
                    </div>
                </div>
                <div class="mb-4">
                    <label class="form-label" for="id_password">Password</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="fa-solid fa-lock"></i></span>
                        <input type="password" name="password" class="form-control" id="id_password" required placeholder="Enter your password">
                    </div>
                </div>
                <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold">Sign In</button>
            </form>
            <div class="text-center mt-3">
                <small class="text-muted">Don't have an account? <a href="{% url 'register' %}" class="text-primary text-decoration-none">Register here</a></small>
            </div>
        </div>
    </div>
</div>
{% endblock %}
